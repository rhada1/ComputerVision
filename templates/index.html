<!DOCTYPE html>
<html>
<head>
    <title>Face Recognition System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .video-container {
            margin: 20px 0;
            border: 2px solid #333;
            border-radius: 5px;
        }
        #videoFeed {
            max-width: 100%;
            height: auto;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Face Recognition System</h1>
    <div class="video-container">
        <img id="videoFeed" src="{{ url_for('video_feed') }}">
    </div>
    <div class="controls">
        <button onclick="stopVideo()">Stop Video</button>
    </div>

    <script>
        function stopVideo() {
            fetch('/stop', {
                method: 'POST'
            }).then(response => {
                if(response.ok) {
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
