<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navbar styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 10px 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
        }

        .navbar a:hover {
            background-color: #575757;
            border-radius: 4px;
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        .video-container {
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 5px;
            max-width: 640px;
        }

        #videoFeed {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Page Content -->
    <div class="content">
        <h1>Face Recognition System</h1>
        <div class="video-container">
            <img id="videoFeed" src="{{ url_for('video_feed') }}">
        </div>
        <div class="controls">
            <button onclick="stopVideo()">Stop Video</button>
        </div>
    </div>

    <script>
        function stopVideo() {
            fetch('/stop', {
                method: 'POST'
            }).then(response => {
                if (response.ok) {
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
